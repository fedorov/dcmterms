<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR Templates — dcmterms</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a3a5c'/%3E%3Crect x='5' y='8' width='22' height='4' rx='1' fill='white'/%3E%3Crect x='5' y='14' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3Crect x='5' y='18.5' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3Crect x='5' y='23' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
    if (typeof echarts === 'undefined') {
      document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"><\/scr'+'ipt>');
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f0f4f8;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a3a5c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .back-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .back-link:hover { color: white; }
    .header-sep { color: rgba(255,255,255,0.3); font-size: 16px; }
    header h1 { font-size: 17px; font-weight: 600; }
    .badge {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 2px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .dot.loading { background: #93c5fd; }
    .dot.error   { background: #f87171; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

    /* ── Control panel ── */
    .control-panel {
      background: white;
      border-bottom: 1px solid #e0e4e8;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      pointer-events: none;
    }
    #searchInput {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 10px 6px 30px;
      font-size: 13px;
      width: 230px;
      background: white;
    }
    #searchInput:focus {
      outline: none;
      border-color: #1a3a5c;
      box-shadow: 0 0 0 3px rgba(26,58,92,0.12);
    }

    .toggle-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      background: white;
      color: #778;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toggle-btn.active-tid {
      border-color: #1a3a5c;
      color: #1a3a5c;
      background: #e8f0fe;
    }
    .toggle-btn.active-cid {
      border-color: #2d7a4f;
      color: #2d7a4f;
      background: #e6f4ed;
    }
    #statsText { margin-left: auto; font-size: 12px; color: #889; }

    /* ── Main ── */
    #main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
    #chart-container { flex: 1; height: 100%; }

    /* ── Detail panel ── */
    #detail-panel {
      width: 340px;
      flex-shrink: 0;
      background: white;
      border-left: 1px solid #dde3ea;
      overflow-y: auto;
      padding: 14px 16px;
    }
    #detail-panel.hidden { display: none; }
    #close-panel {
      float: right;
      background: none;
      border: none;
      color: #889;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    #close-panel:hover { color: #334; }
    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a3a5c;
      margin-bottom: 3px;
      padding-right: 24px;
    }
    .panel-title.cid { color: #2d7a4f; }
    .panel-subtitle {
      font-size: 0.85rem;
      color: #556;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .meta-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .meta-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
    }
    .meta-tag.type-tid  { background: #e8f0fe; color: #1a56b0; }
    .meta-tag.type-cid  { background: #e6f4ed; color: #2d7a4f; }
    .meta-tag.root-tag  { background: #dbeafe; color: #1e40af; }
    .meta-tag.rows-tag  { background: #f0f4f8; color: #667; }

    .panel-section {
      font-size: 12px;
      font-weight: 600;
      color: #334;
      margin: 12px 0 7px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e8edf2;
    }
    .chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s;
      font-family: monospace;
    }
    .chip.tid { background: #e8f0fe; color: #1a56b0; }
    .chip.tid:hover { background: #d0e2fc; }
    .chip.cid { background: #e6f4ed; color: #2d7a4f; }
    .chip.cid:hover { background: #c8e9d8; }

    .dicom-btn {
      display: block;
      text-align: center;
      padding: 9px 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s;
    }
    .dicom-btn.tid-btn {
      background: rgba(26,58,92,0.07);
      border: 1px solid #1a3a5c;
      color: #1a3a5c;
    }
    .dicom-btn.tid-btn:hover { background: rgba(26,58,92,0.14); }
    .dicom-btn.cid-btn {
      background: rgba(45,122,79,0.07);
      border: 1px solid #2d7a4f;
      color: #2d7a4f;
    }
    .dicom-btn.cid-btn:hover { background: rgba(45,122,79,0.14); }

    /* ── Graph hint ── */
    #graph-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.88);
      color: #667;
      font-size: 11.5px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid #dde3ea;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: opacity 0.5s;
    }
    #graph-hint.hidden { opacity: 0; }
    #graph-hint kbd {
      display: inline-block;
      background: #f0f4f8;
      border: 1px solid #d0d8e0;
      border-radius: 3px;
      padding: 0 4px;
      font-family: inherit;
      font-size: 10.5px;
      color: #445;
    }

    /* ── Loading overlay ── */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(240,244,248,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 14px;
    }
    #loadingOverlay.hidden { display: none; }
    #loadingOverlay p { color: #556; font-size: 14px; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d0d8e4;
      border-top-color: #1a3a5c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <polyline points="15 18 9 12 15 6"/>

    dcmterms
  </a>

  <div class="status-row">

<div class="control-panel">
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

           placeholder="Search templates or context groups…" autocomplete="off" spellcheck="false">

<script type="importmap">

<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/dist/duckdb-browser.mjs';

// ── DOM refs ──────────────────────────────────────────────────────────────────
const editionBadge   = document.getElementById('editionBadge');
const countBadge     = document.getElementById('countBadge');
const statusDot      = document.getElementById('statusDot');
const statusText     = document.getElementById('statusText');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText    = document.getElementById('loadingText');
const searchInput    = document.getElementById('searchInput');
const btnTidEdges    = document.getElementById('btnTidEdges');
const btnCidRefs     = document.getElementById('btnCidRefs');
const btnCidNodes    = document.getElementById('btnCidNodes');
const statsText      = document.getElementById('statsText');
const detailPanel    = document.getElementById('detail-panel');
const panelContent   = document.getElementById('panel-content');
const closePanel     = document.getElementById('close-panel');
const graphHint      = document.getElementById('graph-hint');

// ── State ─────────────────────────────────────────────────────────────────────
let myChart = null;
let allNodes = [];
let allLinks = [];
const tidMap    = new Map();   // tid_id -> {tid_name, tid_type, root, num_rows}
const cidMap    = new Map();   // cid_number_str -> {cid_name, cid_type}
const adjacency = new Map();   // 'TID:1500' -> [{target_type, target_id, relationship}]
const nodeIdxMap = new Map();  // node id -> data index in last render

const filter = { showTidTid: true, showCidRefs: true, showCids: true };
let searchQuery = '';
let debounceTimer = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
const TID_URL = id  => `https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_TID_${id}.html`;
const CID_URL = num => `https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_${num}.html`;

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg, state = 'ok') {
  statusText.textContent = msg;
  statusDot.className = 'dot' +
    (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
}

// ── Metadata ──────────────────────────────────────────────────────────────────
async function loadMetadata() {
  try {
    const meta = await (await fetch('./data/extraction_metadata.json')).json();
    editionBadge.textContent = `Edition: ${meta.dicom_edition} · ${meta.extraction_date}`;
  } catch { editionBadge.textContent = 'DICOM Terminology'; }
}

// ── DuckDB init ───────────────────────────────────────────────────────────────
async function initDB() {
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}")`], { type: 'text/javascript' })
  );
  const worker = new Worker(workerUrl);
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  return db;
}

async function registerParquet(db, name) {
  const resp = await fetch(`./data/${name}.parquet`);
  if (!resp.ok) throw new Error(`${name}.parquet: HTTP ${resp.status}`);
  await db.registerFileBuffer(`${name}.parquet`, new Uint8Array(await resp.arrayBuffer()));
}

// ── Load data ──────────────────────────────────────────────────────────────────
async function loadAllData(conn) {
  for (const r of (await conn.query(`SELECT tid_id, tid_name, tid_type, root, num_rows FROM templates`)).toArray()) {
    tidMap.set(String(r['tid_id'] ?? ''), {
      tid_name: String(r['tid_name'] ?? ''),
      tid_type: String(r['tid_type'] ?? ''),
      root:     String(r['root']     ?? ''),
      num_rows: Number(r['num_rows'] ?? 0),
    });
  }

  for (const r of (await conn.query(`SELECT cid_number::VARCHAR AS n, cid_name, cid_type FROM context_groups`)).toArray()) {
    cidMap.set(String(r['n'] ?? ''), {
      cid_name: String(r['cid_name'] ?? ''),
      cid_type: String(r['cid_type'] ?? ''),
    });
  }

  for (const r of (await conn.query(
    `SELECT DISTINCT source_id, target_type, target_id, relationship FROM relationships WHERE source_type='TID'`
  )).toArray()) {
    const key = 'TID:' + String(r['source_id'] ?? '');
    if (!adjacency.has(key)) adjacency.set(key, []);
    adjacency.get(key).push({
      target_type:  String(r['target_type']  ?? ''),
      target_id:    String(r['target_id']    ?? ''),
      relationship: String(r['relationship'] ?? ''),
    });
  }
}

// ── Build graph data ───────────────────────────────────────────────────────────
function buildGraphData() {
  const degree = new Map();
  for (const [key, edges] of adjacency) {
    for (const e of edges) {
      const tgt = e.target_type + ':' + e.target_id;
      degree.set(key, (degree.get(key) || 0) + 1);
      degree.set(tgt, (degree.get(tgt) || 0) + 1);
    }
  }

  const refCids = new Set();
  for (const edges of adjacency.values())
    for (const e of edges) if (e.target_type === 'CID') refCids.add(e.target_id);

  for (const [id, t] of tidMap) {
    const deg = degree.get('TID:' + id) || 0;
    allNodes.push({
      id: 'TID:' + id,
      name: `TID ${id}`,
      value: deg,
      category: t.root === 'yes' ? 1 : 0,
      symbolSize: Math.max(8, Math.min(28, 8 + Math.sqrt(deg) * 2.8)),
      label: { show: false },
      _type: 'TID', _tid_id: id, _srch: (`tid${id} ${t.tid_name}`).toLowerCase(),
    });
  }

  for (const num of refCids) {
    const c = cidMap.get(num);
    const deg = degree.get('CID:' + num) || 0;
    allNodes.push({
      id: 'CID:' + num,
      name: `CID ${num}`,
      value: deg,
      category: 2,
      symbolSize: Math.max(6, Math.min(18, 6 + Math.sqrt(deg) * 2.0)),
      label: { show: false },
      _type: 'CID', _cid_num: num, _srch: (`cid${num} ${c ? c.cid_name : ''}`).toLowerCase(),
    });
  }

  for (const [srcKey, edges] of adjacency) {
    for (const { target_type, target_id, relationship } of edges) {
      allLinks.push({
        source: srcKey,
        target: target_type + ':' + target_id,
        value: relationship,
        lineStyle: {
          color: relationship === 'includes' ? '#3a6a9c' : '#2d7a4f',
          type:  relationship === 'includes' ? 'solid' : 'dashed',
          opacity: 0.22,
          width: 1,
        },
        _rel: relationship,
      });
    }
  }

  countBadge.textContent = `${tidMap.size} templates · ${refCids.size} context groups`;
}

function updateStats() {
  const vn = allNodes.filter(n => n._type === 'TID' || filter.showCids).length;
  const vl = allLinks.filter(l => {
    if (l._rel === 'includes'   && !filter.showTidTid)  return false;
    if (l._rel === 'references' && !filter.showCidRefs) return false;
    if (!filter.showCids && l.target.startsWith('CID:')) return false;
    return true;
  }).length;
  statsText.textContent = `${vn.toLocaleString()} nodes · ${vl.toLocaleString()} edges`;
}

// ── ECharts init ───────────────────────────────────────────────────────────────
function initChart() {
  myChart = echarts.init(document.getElementById('chart-container'), null, { renderer: 'canvas' });

  myChart.setOption({
    backgroundColor: '#f8fafc',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(255,255,255,0.97)',
      borderColor: '#dde3ea',
      borderWidth: 1,
      padding: [10, 14],
      textStyle: { color: '#1a1a1a', fontSize: 12 },
      extraCssText: 'box-shadow:0 4px 16px rgba(0,0,0,0.1);',
      formatter(params) {
        if (params.dataType === 'node') {
          const d = params.data;
          if (d._type === 'TID') {
            const t = tidMap.get(d._tid_id) ?? {};
            const edges = adjacency.get(d.id) ?? [];
            const ti = edges.filter(e => e.target_type === 'TID').length;
            const ci = edges.filter(e => e.target_type === 'CID').length;
            return `<b style="color:#1a3a5c">TID ${esc(d._tid_id)}</b><br>` +
                   `${esc(t.tid_name ?? '')}<br>` +
                   `<span style="color:#889;font-size:11px">` +
                   `${ti} TID include${ti!==1?'s':''} · ${ci} CID ref${ci!==1?'s':''}</span>`;
          } else {
            const c = cidMap.get(d._cid_num) ?? {};
            return `<b style="color:#2d7a4f">CID ${esc(d._cid_num)}</b><br>` +
                   `${esc(c.cid_name ?? '')}<br>` +
                   `<span style="color:#889;font-size:11px">${esc(c.cid_type ?? '')}</span>`;
          }
        }
        if (params.dataType === 'edge') {
          return `<span style="color:#889">${esc(params.data.value)}</span>`;
        }
        return '';
      }
    },
    legend: [{
      data: ['Template', 'Root Template', 'Context Group'],
      textStyle: { color: '#556', fontSize: 12 },
      right: 12,
      top: 8,
      itemWidth: 10,
      itemHeight: 10,
    }],
    series: [{
      type: 'graph',
      layout: 'force',
      animation: true,
      animationDuration: 1400,
      animationEasingUpdate: 'quinticInOut',
      data: buildVisibleNodes().nodes,
      links: buildVisibleLinks(new Set()),
      categories: [
        { name: 'Template',      itemStyle: { color: '#1a3a5c' } },
        { name: 'Root Template', itemStyle: { color: '#4a8abf' } },
        { name: 'Context Group', itemStyle: { color: '#2d7a4f' } },
      ],
      roam: true,
      draggable: true,
      selectedMode: 'single',
      select: {
        label: { show: true, fontSize: 12, fontWeight: 'bold', color: '#1a1a1a' },
        itemStyle: {
          borderColor: '#e8a020',
          borderWidth: 3,
          shadowBlur: 18,
          shadowColor: 'rgba(232,160,32,0.45)',
        },
      },
      scaleLimit: { min: 0.08, max: 6 },
      force: {
        repulsion: [80, 240],
        edgeLength: [20, 160],
        gravity: 0.08,
        friction: 0.65,
        layoutAnimation: true,
      },
      label: {
        show: false,
        position: 'right',
        color: '#445',
        fontSize: 10,
        formatter: '{b}',
      },
      lineStyle: { width: 1, opacity: 0.22, curveness: 0.15 },
      emphasis: {
        focus: 'adjacency',
        scale: true,
        scaleSize: 5,
        label: { show: true, fontSize: 11, color: '#1a1a1a' },
        lineStyle: { width: 2.5, opacity: 0.8 },
        itemStyle: { shadowBlur: 14, shadowColor: 'rgba(26,58,92,0.3)' },
      },
      blur: {
        itemStyle: { opacity: 0.05 },
        lineStyle: { opacity: 0.03 },
        label: { show: false },
      },
      edgeSymbol: ['none', 'arrow'],
      edgeSymbolSize: [0, 5],
    }],
  });

  myChart.on('click', params => {
    if (params.dataType === 'node') showDetailPanel(params.data);
  });

  myChart.getZr().on('mousedown', () => graphHint.classList.add('hidden'));
  window.addEventListener('resize', () => myChart.resize());
}

// ── Visible data builders ──────────────────────────────────────────────────────
function buildVisibleNodes() {
  const q = searchQuery.toLowerCase().trim();
  nodeIdxMap.clear();
  const matched = new Set();
  const nodes = allNodes
    .filter(n => n._type === 'TID' || filter.showCids)
    .map((n, i) => {
      nodeIdxMap.set(n.id, i);
      if (!q || n._srch.includes(q)) { matched.add(n.id); return n; }
      return { ...n, itemStyle: { color: '#e2e8f0', borderColor: 'transparent' }, label: { show: false } };
    });
  return { nodes, matched };
}

function buildVisibleLinks(matched) {
  const searching = matched.size > 0;
  return allLinks
    .filter(l => {
      if (l._rel === 'includes'   && !filter.showTidTid)  return false;
      if (l._rel === 'references' && !filter.showCidRefs) return false;
      if (!filter.showCids && l.target.startsWith('CID:')) return false;
      return true;
    })
    .map(l => {
      if (!searching || matched.has(l.source) || matched.has(l.target)) return l;
      return { ...l, lineStyle: { color: '#dde3ea', opacity: 0.08, width: 0.5 } };
    });
}

function rerender() {
  if (!myChart) return;
  const { nodes, matched } = buildVisibleNodes();
  myChart.setOption({ series: [{ data: nodes, links: buildVisibleLinks(matched) }] }, false);
  updateStats();
}

// ── Detail panel ───────────────────────────────────────────────────────────────
function showDetailPanel(nodeData) {
  detailPanel.classList.remove('hidden');

  if (nodeData._type === 'TID') {
    const id = nodeData._tid_id;
    const t  = tidMap.get(id) ?? { tid_name: id, tid_type: '', root: '', num_rows: 0 };
    const edges      = adjacency.get('TID:' + id) ?? [];
    const tidIncludes = edges.filter(e => e.target_type === 'TID');
    const cidRefs     = edges.filter(e => e.target_type === 'CID');

    const typeTag = t.tid_type  ? `<span class="meta-tag type-tid">${esc(t.tid_type)}</span>` : '';
    const rootTag = t.root==='yes' ? `<span class="meta-tag root-tag">root</span>` : '';
    const rowsTag = `<span class="meta-tag rows-tag">${t.num_rows} rows</span>`;

    const tidChips = tidIncludes.map(e => {
      const nm = tidMap.get(e.target_id);
      return `<span class="chip tid" data-focus="TID:${esc(e.target_id)}" title="${esc(nm ? nm.tid_name : '')}">TID ${esc(e.target_id)}</span>`;
    }).join('');

    const cidChips = cidRefs.map(e => {
      const c = cidMap.get(e.target_id);
      return `<span class="chip cid" data-focus="CID:${esc(e.target_id)}" title="${esc(c ? c.cid_name : '')}">CID ${esc(e.target_id)}</span>`;
    }).join('');

    panelContent.innerHTML = `
      <div class="panel-title">TID ${esc(id)}</div>
      <div class="panel-subtitle">${esc(t.tid_name)}</div>
      <div class="meta-row">${typeTag}${rootTag}${rowsTag}</div>
      ${tidIncludes.length ? `<div class="panel-section">TID Includes (${tidIncludes.length})</div><div class="chip-list">${tidChips}</div>` : ''}
      ${cidRefs.length ? `<div class="panel-section">CID References (${cidRefs.length})</div><div class="chip-list">${cidChips}</div>` : ''}
      <a class="dicom-btn tid-btn" href="${esc(TID_URL(id))}" target="_blank" rel="noopener">View in DICOM Standard ↗</a>
    `;
  } else {
    const num = nodeData._cid_num;
    const c   = cidMap.get(num) ?? { cid_name: num, cid_type: '' };
    const typeTag = c.cid_type ? `<span class="meta-tag type-cid">${esc(c.cid_type)}</span>` : '';
    panelContent.innerHTML = `
      <div class="panel-title cid">CID ${esc(num)}</div>
      <div class="panel-subtitle">${esc(c.cid_name)}</div>
      <div class="meta-row">${typeTag}</div>
      <a class="dicom-btn cid-btn" href="${esc(CID_URL(num))}" target="_blank" rel="noopener">View in DICOM Standard ↗</a>
    `;
  }

  panelContent.querySelectorAll('.chip[data-focus]').forEach(chip => {
    chip.addEventListener('click', () => {
      const nodeId = chip.dataset.focus;
      const idx = nodeIdxMap.get(nodeId);
      if (idx != null) {
        myChart.dispatchAction({ type: 'select',    seriesIndex: 0, dataIndex: idx });
        myChart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: idx });
      }
      const nd = allNodes.find(n => n.id === nodeId);
      if (nd) showDetailPanel(nd);
    });
  });
}

// ── Events ─────────────────────────────────────────────────────────────────────
closePanel.addEventListener('click', () => detailPanel.classList.add('hidden'));

function toggleBtn(btn, field, cls) {
  filter[field] = !filter[field];
  btn.className = 'toggle-btn' + (filter[field] ? ` ${cls}` : '');
  rerender();
}
btnTidEdges.addEventListener('click', () => toggleBtn(btnTidEdges, 'showTidTid',  'active-tid'));
btnCidRefs .addEventListener('click', () => toggleBtn(btnCidRefs,  'showCidRefs', 'active-cid'));
btnCidNodes.addEventListener('click', () => toggleBtn(btnCidNodes, 'showCids',    'active-cid'));

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { searchQuery = searchInput.value; rerender(); }, 250);
});

// ── Main init ──────────────────────────────────────────────────────────────────
async function init() {
  try {
    await loadMetadata();
    setStatus('Loading data…', 'loading');

    const db = await initDB();
    loadingText.textContent = 'Loading parquet files…';

    await Promise.all([
      registerParquet(db, 'templates'),
      registerParquet(db, 'relationships'),
      registerParquet(db, 'context_groups'),
    ]);

    const conn = await db.connect();
    await conn.query(`CREATE VIEW templates      AS SELECT * FROM read_parquet('templates.parquet')`);
    await conn.query(`CREATE VIEW relationships  AS SELECT * FROM read_parquet('relationships.parquet')`);
    await conn.query(`CREATE VIEW context_groups AS SELECT * FROM read_parquet('context_groups.parquet')`);

    loadingText.textContent = 'Building graph…';
    await loadAllData(conn);
    buildGraphData();
    updateStats();

    loadingText.textContent = 'Rendering…';
    initChart();

    loadingOverlay.classList.add('hidden');
    setStatus(`${tidMap.size} templates · ${allNodes.filter(n=>n._type==='CID').length} context groups`);
  } catch (e) {
    loadingText.textContent = 'Error: ' + e.message;
    setStatus('Load failed', 'error');
    console.error(e);
  }
}

init();
</script>
