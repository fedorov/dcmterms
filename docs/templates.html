<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SR Templates — dcmterms</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a3a5c'/%3E%3Crect x='5' y='8' width='22' height='4' rx='1' fill='white'/%3E%3Crect x='5' y='14' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3Crect x='5' y='18.5' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3Crect x='5' y='23' width='22' height='2.5' rx='1' fill='rgba(255,255,255,0.55)'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
           color: #1a1a1a; background: #f0f4f8;
           height: 100vh; overflow: hidden;
           display: flex; flex-direction: column; }

    /* ── Header ── */
    header { background: #1a3a5c; color: white; padding: 10px 20px;
             display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
    .back-link { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px;
                 display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .back-link:hover { color: white; }
    .header-sep { color: rgba(255,255,255,0.3); font-size: 16px; }
    header h1 { font-size: 17px; font-weight: 600; }
    .badge { background: rgba(255,255,255,0.15); border-radius: 4px;
             padding: 2px 9px; font-size: 12px; white-space: nowrap; }

    /* ── App shell ── */
    #appShell { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
               overflow: hidden; background: white; border-right: 1px solid #dde3ea; }
    .sidebar-header { flex-shrink: 0; padding: 10px 12px 8px;
                      border-bottom: 1px solid #eaeef2; background: #f8fafc; }
    #tidSearch { width: 100%; padding: 7px 10px; border: 1px solid #ccc;
                 border-radius: 6px; font-size: 13px; }
    #tidSearch:focus { outline: none; border-color: #1a3a5c;
                       box-shadow: 0 0 0 3px rgba(26,58,92,0.12); }
    .sidebar-filter { display: flex; align-items: center; gap: 6px;
                      font-size: 12px; color: #445; margin-top: 8px; cursor: pointer; }
    .sidebar-filter input { cursor: pointer; }
    #tidCount { font-size: 11px; color: #889; margin-top: 5px; }

    #tidList { flex: 1; overflow-y: auto; }
    .tid-item { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
                border-left: 3px solid transparent; }
    .tid-item:hover { background: #f5f7fa; }
    .tid-item.active { background: #e8f0fe; border-left-color: #1a3a5c; }
    .tid-item-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .tid-id-label { font-size: 11px; font-weight: 700; font-family: monospace;
                    color: #1a3a5c; }
    .root-badge { font-size: 10px; font-weight: 700; background: #1a3a5c; color: white;
                  padding: 1px 5px; border-radius: 3px; }
    .retired-badge { font-size: 10px; font-weight: 700; background: #aaa; color: white;
                     padding: 1px 5px; border-radius: 3px; }
    .tid-name { font-size: 12px; color: #334; margin-top: 2px; line-height: 1.3; }

    .list-loading { padding: 32px; text-align: center; color: #888; }
    .spinner { display: inline-block; width: 18px; height: 18px; margin-bottom: 8px;
               border: 3px solid #e0e0e0; border-top-color: #1a3a5c;
               border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Graph area ── */
    #graphArea { flex: 1; display: flex; flex-direction: column; overflow: hidden;
                 position: relative; background: #f8fafc; }

    #graphControls { flex-shrink: 0; height: 38px; background: white;
                     border-bottom: 1px solid #e0e4e8;
                     display: flex; align-items: center; gap: 16px; padding: 0 14px;
                     font-size: 12px; color: #445; }
    #graphControls label { display: flex; align-items: center; gap: 5px; cursor: pointer;
                           user-select: none; }
    #graphControls input[type=checkbox] { cursor: pointer; }
    #graphStatus { margin-left: auto; color: #889; font-size: 11px; white-space: nowrap; }

    #cy { flex: 1; }

    #emptyState { position: absolute; inset: 0; top: 38px; z-index: 5;
                  display: flex; flex-direction: column; align-items: center;
                  justify-content: center; background: #f8fafc;
                  color: #778; pointer-events: none; }
    #emptyState h2 { font-size: 16px; font-weight: 400; color: #556; margin-bottom: 8px; }
    #emptyState p { font-size: 13px; line-height: 1.6; text-align: center; }
    #emptyState .empty-icon { font-size: 36px; margin-bottom: 14px; }

    /* ── Info panel ── */
    #infoPanel { flex-shrink: 0; background: white; border-top: 1px solid #dde3ea;
                 padding: 10px 14px; min-height: 110px; max-height: 160px; overflow-y: auto; }
    #infoPanel.hidden { display: none; }
    .info-header { display: flex; align-items: center; justify-content: space-between;
                   margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
    .info-header-left { display: flex; align-items: center; gap: 8px; }
    .info-type-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
                       color: white; white-space: nowrap; }
    .info-type-badge.tid { background: #1a3a5c; }
    .info-type-badge.cid { background: #2d7a4f; }
    .info-label { font-size: 14px; font-weight: 600; color: #1a1a1a; }
    .info-header-right { display: flex; align-items: center; gap: 8px; }
    .dicom-link { font-size: 12px; color: #1a56b0; text-decoration: none; white-space: nowrap; }
    .dicom-link:hover { text-decoration: underline; }
    #closeInfoBtn { background: none; border: none; font-size: 18px; line-height: 1;
                    color: #889; cursor: pointer; padding: 0 2px; }
    #closeInfoBtn:hover { color: #334; }
    .info-dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; }
    .info-dl dt { color: #778; white-space: nowrap; }
    .info-dl dd { color: #334; }

    /* ── Status bar ── */
    #statusBar { flex-shrink: 0; padding: 4px 16px; font-size: 12px; color: #666;
                 background: #fafafa; border-top: 1px solid #ebebeb; min-height: 24px; }
    #statusBar.error { color: #c0392b; background: #fef0ee; }
  </style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    dcmterms
  </a>
  <span class="header-sep">/</span>
  <h1>SR Templates</h1>
  <span class="badge" id="editionBadge">Loading…</span>
  <span class="badge" id="countBadge"></span>
</header>

<div id="appShell">

  <aside id="sidebar">
    <div class="sidebar-header">
      <input id="tidSearch" type="search" placeholder="Filter by name or number…"
             autocomplete="off" spellcheck="false">
      <label class="sidebar-filter">
        <input type="checkbox" id="filterRoot">
        Root templates only
      </label>
      <div id="tidCount">Loading…</div>
    </div>
    <div id="tidList">
      <div class="list-loading">
        <div class="spinner"></div>
        <div>Loading templates…</div>
      </div>
    </div>
  </aside>

  <div id="graphArea">
    <div id="graphControls">
      <label><input type="checkbox" id="showCids" checked> CID nodes</label>
      <label><input type="checkbox" id="showTidEdges" checked> TID→TID edges</label>
      <label><input type="checkbox" id="showCidRefs" checked> TID→CID edges</label>
      <span id="graphStatus"></span>
    </div>

    <div id="cy"></div>

    <div id="emptyState">
      <div class="empty-icon">📋</div>
      <h2>Select a template to explore</h2>
      <p>Choose an SR Template from the list on the left<br>
         to visualize its include and Context Group reference relationships.</p>
    </div>

    <div id="infoPanel" class="hidden">
      <div class="info-header">
        <div class="info-header-left">
          <span class="info-type-badge" id="infoTypeBadge"></span>
          <span class="info-label" id="infoLabel"></span>
        </div>
        <div class="info-header-right">
          <a class="dicom-link" id="infoLink" href="#" target="_blank" rel="noopener">
            View in DICOM Standard ↗
          </a>
          <button id="closeInfoBtn" title="Close">×</button>
        </div>
      </div>
      <dl class="info-dl" id="infoDetails"></dl>
    </div>
  </div>

</div>

<div id="statusBar">Initializing DuckDB…</div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.33.2/dist/cytoscape.min.js"></script>

<script type="importmap">
{ "imports": { "apache-arrow": "https://esm.sh/apache-arrow@18" } }
</script>
<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/dist/duckdb-browser.mjs';

// ── DOM refs ────────────────────────────────────────────────────────────────
const editionBadge = document.getElementById('editionBadge');
const countBadge   = document.getElementById('countBadge');
const statusBar    = document.getElementById('statusBar');
const tidSearch    = document.getElementById('tidSearch');
const filterRoot   = document.getElementById('filterRoot');
const tidCount     = document.getElementById('tidCount');
const tidList      = document.getElementById('tidList');
const emptyState   = document.getElementById('emptyState');
const infoPanel    = document.getElementById('infoPanel');
const infoTypeBadge = document.getElementById('infoTypeBadge');
const infoLabel    = document.getElementById('infoLabel');
const infoLink     = document.getElementById('infoLink');
const infoDetails  = document.getElementById('infoDetails');
const closeInfoBtn = document.getElementById('closeInfoBtn');
const graphStatus  = document.getElementById('graphStatus');
const showCids     = document.getElementById('showCids');
const showTidEdges = document.getElementById('showTidEdges');
const showCidRefs  = document.getElementById('showCidRefs');

// ── State ───────────────────────────────────────────────────────────────────
let cy = null;
let allTids = [];           // [{tid_id, tid_name, tid_type, root, num_rows}]
let tidMap  = new Map();    // tid_id -> metadata
let cidMap  = new Map();    // cid_number_str -> {cid_name, cid_type}
let adjacency = new Map();  // 'TID:1500' -> [{target_type, target_id, relationship}]
let currentTidId = null;

// ── Helpers ─────────────────────────────────────────────────────────────────
const TID_URL = id  => `https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_TID_${id}.html`;
const CID_URL = num => `https://dicom.nema.org/medical/dicom/current/output/chtml/part16/sect_CID_${num}.html`;

function setStatus(msg, isError = false) {
  statusBar.textContent = msg;
  statusBar.className = isError ? 'error' : '';
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n - 1) + '\u2026' : s;
}

function tidSortKey(id) {
  const num = id.replace(/[A-Za-z]+$/, '').padStart(6, '0');
  const suf = id.replace(/^\d+/, '');
  return num + suf;
}

// ── Metadata ─────────────────────────────────────────────────────────────────
async function loadMetadata() {
  try {
    const meta = await (await fetch('./data/extraction_metadata.json')).json();
    editionBadge.textContent = `Edition: ${meta.dicom_edition} · ${meta.extraction_date}`;
  } catch {
    editionBadge.textContent = 'DICOM Terminology';
  }
}

// ── DuckDB init ──────────────────────────────────────────────────────────────
async function initDB() {
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}")`], { type: 'text/javascript' })
  );
  const worker = new Worker(workerUrl);
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  return db;
}

async function registerParquet(db, name) {
  const resp = await fetch(`./data/${name}.parquet`);
  if (!resp.ok) throw new Error(`${name}.parquet: HTTP ${resp.status}`);
  await db.registerFileBuffer(`${name}.parquet`, new Uint8Array(await resp.arrayBuffer()));
}

// ── Load all data ────────────────────────────────────────────────────────────
async function loadAllData(conn) {
  // Templates
  const tplResult = await conn.query(
    `SELECT tid_id, tid_name, tid_type, root, num_rows FROM templates`
  );
  for (const row of tplResult.toArray()) {
    const t = {
      tid_id:   String(row['tid_id']   ?? ''),
      tid_name: String(row['tid_name'] ?? ''),
      tid_type: String(row['tid_type'] ?? ''),
      root:     String(row['root']     ?? ''),
      num_rows: Number(row['num_rows'] ?? 0),
    };
    allTids.push(t);
    tidMap.set(t.tid_id, t);
  }
  allTids.sort((a, b) => {
    const ar = a.root === 'yes', br = b.root === 'yes';
    if (ar !== br) return ar ? -1 : 1;
    return tidSortKey(a.tid_id).localeCompare(tidSortKey(b.tid_id));
  });

  // Context groups (cid_number is integer in parquet — cast to string)
  const cgResult = await conn.query(
    `SELECT cid_number::VARCHAR AS cid_number, cid_name, cid_type FROM context_groups`
  );
  for (const row of cgResult.toArray()) {
    const num = String(row['cid_number'] ?? '');
    cidMap.set(num, {
      cid_name: String(row['cid_name'] ?? ''),
      cid_type: String(row['cid_type'] ?? ''),
    });
  }

  // Relationships — TID-sourced only, deduplicated
  const relResult = await conn.query(
    `SELECT DISTINCT source_id, target_type, target_id, relationship
     FROM relationships WHERE source_type = 'TID'`
  );
  for (const row of relResult.toArray()) {
    const key = 'TID:' + String(row['source_id'] ?? '');
    if (!adjacency.has(key)) adjacency.set(key, []);
    adjacency.get(key).push({
      target_type: String(row['target_type'] ?? ''),
      target_id:   String(row['target_id']   ?? ''),
      relationship: String(row['relationship'] ?? ''),
    });
  }
}

// ── Cytoscape init ────────────────────────────────────────────────────────────
function initCytoscape() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [],
    style: [
      {
        selector: 'node[type = "TID"]',
        style: {
          'background-color': '#1a3a5c',
          'color': 'white',
          'shape': 'round-rectangle',
          'width': 160,
          'height': 50,
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '144px',
          'font-size': '11px',
          'font-family': 'system-ui, -apple-system, sans-serif',
          'border-width': 0,
        }
      },
      {
        selector: 'node[type = "TID"][root = "yes"]',
        style: {
          'border-width': 3,
          'border-color': '#4a8abf',
        }
      },
      {
        selector: 'node.focused',
        style: {
          'border-width': 4,
          'border-color': '#e8a020',
        }
      },
      {
        selector: 'node[type = "CID"]',
        style: {
          'background-color': '#2d7a4f',
          'color': 'white',
          'shape': 'round-rectangle',
          'width': 148,
          'height': 46,
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '132px',
          'font-size': '10px',
          'font-family': 'system-ui, -apple-system, sans-serif',
        }
      },
      {
        selector: 'edge[relationship = "includes"]',
        style: {
          'line-color': '#3a6a9c',
          'target-arrow-color': '#3a6a9c',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'includes',
          'font-size': '9px',
          'color': '#3a6a9c',
          'text-rotation': 'autorotate',
          'text-background-color': '#f8fafc',
          'text-background-opacity': 0.85,
          'text-background-padding': '2px',
        }
      },
      {
        selector: 'edge[relationship = "references"]',
        style: {
          'line-color': '#3a9a6f',
          'target-arrow-color': '#3a9a6f',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'line-style': 'dashed',
          'line-dash-pattern': [8, 4],
          'label': 'references',
          'font-size': '9px',
          'color': '#3a9a6f',
          'text-rotation': 'autorotate',
          'text-background-color': '#f8fafc',
          'text-background-opacity': 0.85,
          'text-background-padding': '2px',
        }
      },
      {
        selector: 'node:active',
        style: { 'overlay-opacity': 0.1 }
      },
    ],
    layout: { name: 'preset' },
    userZoomingEnabled: true,
    userPanningEnabled: true,
    minZoom: 0.08,
    maxZoom: 4,
  });

  cy.on('tap', 'node', onNodeClick);
}

// ── Sidebar rendering ─────────────────────────────────────────────────────────
function renderTidList() {
  const q = tidSearch.value.trim().toLowerCase();
  const rootOnly = filterRoot.checked;

  const filtered = allTids.filter(t => {
    if (rootOnly && t.root !== 'yes') return false;
    if (!q) return true;
    return t.tid_id.includes(q) || t.tid_name.toLowerCase().includes(q);
  });

  tidCount.textContent = `${filtered.length} of ${allTids.length} templates`;

  if (filtered.length === 0) {
    tidList.innerHTML = `<div class="list-loading" style="padding:20px;color:#889">No templates match</div>`;
    return;
  }

  tidList.innerHTML = filtered.map(t => {
    const active = t.tid_id === currentTidId ? ' active' : '';
    const rootBadge = t.root === 'yes' ? `<span class="root-badge">root</span>` : '';
    const retiredBadge = t.root === '' && t.tid_type === '' ? `<span class="retired-badge">retired</span>` : '';
    return `<div class="tid-item${active}" data-tid="${esc(t.tid_id)}">
      <div class="tid-item-top">
        <span class="tid-id-label">TID ${esc(t.tid_id)}</span>
        ${rootBadge}${retiredBadge}
      </div>
      <div class="tid-name">${esc(t.tid_name)}</div>
    </div>`;
  }).join('');

  tidList.querySelectorAll('.tid-item').forEach(el =>
    el.addEventListener('click', () => focusOnTID(el.dataset.tid))
  );
}

// ── Focus on TID ──────────────────────────────────────────────────────────────
function focusOnTID(tidId) {
  currentTidId = tidId;
  const info = tidMap.get(tidId);
  if (!info) return;

  const edges = adjacency.get('TID:' + tidId) ?? [];
  const elements = [];
  const addedNodes = new Set();
  const addedEdges = new Set();

  // Center node
  const centerLabel = `TID ${tidId}\n${truncate(info.tid_name, 35)}`;
  elements.push({ data: {
    id: 'TID:' + tidId, type: 'TID', tid_id: tidId,
    label: centerLabel, root: info.root
  }, classes: 'focused' });
  addedNodes.add('TID:' + tidId);

  let tidIncludeCount = 0, cidRefCount = 0;

  for (const edge of edges) {
    const { target_type, target_id, relationship } = edge;
    const nodeKey = target_type + ':' + target_id;
    const edgeKey = `TID:${tidId}__${nodeKey}__${relationship}`;
    if (addedEdges.has(edgeKey)) continue;
    addedEdges.add(edgeKey);

    if (!addedNodes.has(nodeKey)) {
      addedNodes.add(nodeKey);
      if (target_type === 'TID') {
        const t = tidMap.get(target_id);
        elements.push({ data: {
          id: nodeKey, type: 'TID', tid_id: target_id,
          label: `TID ${target_id}\n${truncate(t ? t.tid_name : target_id, 35)}`,
          root: t ? t.root : '',
        }});
      } else {
        const c = cidMap.get(target_id);
        elements.push({ data: {
          id: nodeKey, type: 'CID', cid_number: target_id,
          label: `CID ${target_id}\n${truncate(c ? c.cid_name : target_id, 35)}`,
        }});
      }
    }

    elements.push({ data: {
      id: edgeKey, source: 'TID:' + tidId, target: nodeKey, relationship,
    }});

    if (target_type === 'TID') tidIncludeCount++;
    else cidRefCount++;
  }

  cy.elements().remove();
  cy.add(elements);
  applyVisibilityToggles();

  cy.layout({
    name: 'breadthfirst',
    roots: ['TID:' + tidId],
    directed: true,
    padding: 48,
    spacingFactor: 1.4,
    avoidOverlap: true,
  }).run();

  cy.fit(cy.elements(':visible'), 48);

  graphStatus.textContent = `${tidIncludeCount} TID include${tidIncludeCount !== 1 ? 's' : ''} · ${cidRefCount} CID reference${cidRefCount !== 1 ? 's' : ''}`;

  emptyState.style.display = 'none';
  showInfoPanel('TID', tidId);

  // Update sidebar active state without full re-render
  tidList.querySelectorAll('.tid-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tid === tidId);
  });
}

// ── Node click handler ────────────────────────────────────────────────────────
function onNodeClick(evt) {
  const node = evt.target;
  const type = node.data('type');
  if (type === 'TID') {
    focusOnTID(node.data('tid_id'));
  } else if (type === 'CID') {
    showInfoPanel('CID', node.data('cid_number'));
  }
}

// ── Info panel ────────────────────────────────────────────────────────────────
function showInfoPanel(type, id) {
  infoPanel.classList.remove('hidden');
  emptyState.style.display = 'none';

  if (type === 'TID') {
    const t = tidMap.get(id) ?? { tid_name: id, tid_type: '', root: '', num_rows: 0 };
    const edges = adjacency.get('TID:' + id) ?? [];
    const tidInc = edges.filter(e => e.target_type === 'TID').length;
    const cidRef = edges.filter(e => e.target_type === 'CID').length;

    infoTypeBadge.textContent = 'TID';
    infoTypeBadge.className = 'info-type-badge tid';
    infoLabel.textContent = `${id} — ${t.tid_name}`;
    infoLink.href = TID_URL(id);

    const rows = [
      ['Type', t.tid_type || '—'],
      ['Root template', t.root === 'yes' ? 'Yes' : t.root === 'no' ? 'No' : '—'],
      ['Rows', String(t.num_rows)],
      ['TID includes', String(tidInc)],
      ['CID references', String(cidRef)],
    ];
    infoDetails.innerHTML = rows.map(([dt, dd]) =>
      `<dt>${esc(dt)}</dt><dd>${esc(dd)}</dd>`
    ).join('');
  } else {
    const c = cidMap.get(id) ?? { cid_name: id, cid_type: '' };
    infoTypeBadge.textContent = 'CID';
    infoTypeBadge.className = 'info-type-badge cid';
    infoLabel.textContent = `${id} — ${c.cid_name}`;
    infoLink.href = CID_URL(id);
    infoDetails.innerHTML = `<dt>Type</dt><dd>${esc(c.cid_type || '—')}</dd>`;
  }

  setTimeout(() => cy && cy.resize(), 100);
}

// ── Visibility toggles ────────────────────────────────────────────────────────
function applyVisibilityToggles() {
  if (!cy) return;
  const showC = showCids.checked;
  const showT = showTidEdges.checked;
  const showR = showCidRefs.checked;

  cy.nodes('[type = "CID"]').style('display', showC ? 'element' : 'none');
  cy.edges().forEach(e => {
    const rel = e.data('relationship');
    const targetIsCid = e.target().data('type') === 'CID';
    if (targetIsCid && !showC)     { e.style('display', 'none'); return; }
    if (rel === 'includes' && !showT) { e.style('display', 'none'); return; }
    if (rel === 'references' && !showR) { e.style('display', 'none'); return; }
    e.style('display', 'element');
  });
}

// ── HTML escape ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Main init ─────────────────────────────────────────────────────────────────
async function init() {
  try {
    await loadMetadata();
    setStatus('Initializing DuckDB…');

    const db = await initDB();
    setStatus('Loading template data…');

    await Promise.all([
      registerParquet(db, 'templates'),
      registerParquet(db, 'relationships'),
      registerParquet(db, 'context_groups'),
    ]);

    const conn = await db.connect();
    await conn.query(`CREATE VIEW templates AS SELECT * FROM read_parquet('templates.parquet')`);
    await conn.query(`CREATE VIEW relationships AS SELECT * FROM read_parquet('relationships.parquet')`);
    await conn.query(`CREATE VIEW context_groups AS SELECT * FROM read_parquet('context_groups.parquet')`);

    await loadAllData(conn);

    countBadge.textContent = `${allTids.length} templates`;
    initCytoscape();
    renderTidList();

    setStatus(`Ready — ${allTids.length} templates loaded`);
  } catch (e) {
    setStatus('Error initializing: ' + e.message, true);
    console.error(e);
  }
}

// ── Events ────────────────────────────────────────────────────────────────────
tidSearch.addEventListener('input', renderTidList);
filterRoot.addEventListener('change', renderTidList);
showCids.addEventListener('change', applyVisibilityToggles);
showTidEdges.addEventListener('change', applyVisibilityToggles);
showCidRefs.addEventListener('change', applyVisibilityToggles);
closeInfoBtn.addEventListener('click', () => {
  infoPanel.classList.add('hidden');
  if (currentTidId === null) emptyState.style.display = '';
  setTimeout(() => cy && cy.resize(), 100);
});

init();
</script>
